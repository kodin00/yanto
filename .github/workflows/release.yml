name: release

# Publishes static musl binaries, SHA256SUMS, build provenance attestations
# (D27) and install.sh as GitHub Release assets. No container image (D6).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - name: Check tag against workspace version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(awk '/^\[workspace\.package\]/{f=1; next} /^\[/{f=0} f && /^version *=/{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          if [ "$TAG" != "v${version}" ]; then
            echo "tag ${TAG} does not match workspace version v${version}" >&2
            exit 1
          fi
          # A hyphen (v1.0.0-rc.1) marks a pre-release so releases/latest skips it.
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          # Native arm64 hosted runner (label from GitHub's runner reference).
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: jdx/mise-action@v4
        with:
          install_args: rust
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: mise x -- cargo build --release --locked --target "$TARGET" -p yanto-cli
      - name: Assert static binary and smoke-run
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/${TARGET}/release/yanto"
          file "$bin"
          if ldd "$bin" 2>&1 | grep -qv -e 'not a dynamic executable' -e 'statically linked'; then
            echo "binary is dynamically linked" >&2
            exit 1
          fi
          "$bin" version
      - name: Stage asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/yanto" "dist/yanto-${TARGET}"
      - uses: actions/upload-artifact@v4
        with:
          name: yanto-${{ matrix.target }}
          path: dist/yanto-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: yanto-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum yanto-x86_64-unknown-linux-musl yanto-aarch64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/yanto-x86_64-unknown-linux-musl
            dist/yanto-aarch64-unknown-linux-musl
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" \
            dist/yanto-x86_64-unknown-linux-musl \
            dist/yanto-aarch64-unknown-linux-musl \
            dist/SHA256SUMS \
            scripts/install.sh

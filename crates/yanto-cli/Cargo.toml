[package]
name = "yanto-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "yanto"
path = "src/main.rs"

[dependencies]
yanto-core.workspace = true
yanto-host.workspace = true
yanto-server.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2 = "0.11.1"
getrandom = "0.4.3"
semver = "1.0.28"
rustix = { version = "1.1.6", features = ["fs", "process"] }
inquire = "0.9.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
serde = { workspace = true, features = ["derive"] }
sqlx.workspace = true
toml.workspace = true

[dev-dependencies]
yanto-core = { workspace = true, features = ["testing"] }
insta = "1.49.0"
tempfile.workspace = true

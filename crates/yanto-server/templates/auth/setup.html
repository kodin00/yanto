{% extends "layout.html" %}

{% block content %}
<section class="card narrow">
  <h1>Set up Yanto</h1>
  <p class="muted">Create the Owner account. The setup code is printed by <code>yanto setup-code</code> on the server.</p>
  {% if let Some(e) = error %}<p class="error" role="alert">{{ e }}</p>{% endif %}
  <form method="post" action="/setup" class="stack">
    <label>Setup code <input name="code" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" required></label>
    <label>Username <input name="username" value="{{ username }}" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
    <label>Confirm password <input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
    <button type="submit">Create Owner</button>
  </form>
</section>
{% endblock %}

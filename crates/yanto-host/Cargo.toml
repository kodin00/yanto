[package]
name = "yanto-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
yanto-core.workspace = true
async-trait = "0.1.92"
base64.workspace = true
bollard = "0.21.1"
futures-util = "0.3.34"
nix = { version = "0.32.0", features = ["user", "fs", "signal", "process"] }
serde_json.workspace = true
sha2.workspace = true
sysinfo = "0.40.4"
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "macros", "sync"] }
tracing.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["query"] }

[dev-dependencies]
base64.workspace = true
tempfile.workspace = true
yanto-core = { workspace = true, features = ["testing"] }
